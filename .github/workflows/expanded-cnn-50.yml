name: SmartPlant Expanded CNN 50-class Readiness

on:
  pull_request:
    paths:
      - 'smartplant/expanded_*.py'
      - 'smartplant/model_registry.py'
      - 'smartplant/cnn.py'
      - 'scripts/prepare_expanded_labels.py'
      - 'scripts/audit_expanded_dataset.py'
      - 'scripts/train_expanded_cnn.py'
      - 'scripts/export_smartplant_onnx.py'
      - 'tests/test_cnn50_expansion.py'
      - '.github/workflows/expanded-cnn-50.yml'
  push:
    branches: [feature/smartplant-expanded-cnn-50]

jobs:
  audit-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pillow numpy
      - name: Validate label planning, duplicate rejection and opt-in registry
        run: python -m pytest -q tests/test_cnn50_expansion.py

  pinned-warmstart-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and label/metric requirements
        run: |
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install gdown==5.2.0 scikit-learn==1.5.2 numpy==1.26.4 pillow==11.1.0
      - name: Get SHA-pinned original checkpoint and prepare exact 50-class plan
        run: |
          python -c "from smartplant.model_download import ensure_cnn_checkpoint; print(ensure_cnn_checkpoint('models/smartplant_mobilenetv3.pt'))"
          python scripts/prepare_expanded_labels.py --checkpoint models/smartplant_mobilenetv3.pt --output data/expanded/class_plan.json
      - name: Assert old head rows preserved and new output dimension is 50
        run: |
          python - <<'PY'
          import torch
          from smartplant.expanded_labels import read_plan
          from scripts.train_expanded_cnn import fine_tune_model
          checkpoint = torch.load("models/smartplant_mobilenetv3.pt", map_location="cpu", weights_only=True)
          plan = read_plan("data/expanded/class_plan.json")
          model = fine_tune_model("models/smartplant_mobilenetv3.pt", plan).eval()
          assert model.classifier[-1].out_features == 50
          assert torch.equal(model.classifier[-1].weight[:29], checkpoint["state_dict"]["classifier.3.weight"])
          assert torch.equal(model.classifier[-1].bias[:29], checkpoint["state_dict"]["classifier.3.bias"])
          with torch.inference_mode():
              y = model(torch.zeros(1, 3, 160, 160))
          assert y.shape == (1, 50)
          print("50-way warm-start and preserved 29-class head rows: PASS")
          print("NOTE: Synthetic forward pass is NOT training or test accuracy")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: smartplant-50-class-plan-ONLY
          path: data/expanded/class_plan.json
          retention-days: 7
          if-no-files-found: error
