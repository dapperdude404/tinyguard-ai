name: Android Edge Phase 1 Checks
on:
  push:
    branches: [feature/smartplant-android-edge-phase1]
  pull_request:
    paths:
      - 'android-edge/**'
      - 'scripts/export_smartplant_onnx.py'
      - 'tests/test_edge_export.py'
      - 'tests/test_android_ui_v2.py'
      - 'tests/test_phase2_crop_review.py'
      - '.github/workflows/android-edge-phase1.yml'

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_edge_export.py tests/test_android_ui_v2.py tests/test_phase2_crop_review.py

  onnx-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install matched CPU-only PyTorch and ONNX toolchain
        run: |
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install onnx==1.17.0 onnxruntime==1.20.1 gdown==5.2.0 numpy==1.26.4
      - name: Download and verify trusted checkpoint
        run: |
          python -c "from smartplant.model_download import ensure_cnn_checkpoint; print(ensure_cnn_checkpoint('models/smartplant_mobilenetv3.pt'))"
      - name: Export and compare three inputs against PyTorch
        run: |
          python scripts/export_smartplant_onnx.py --checkpoint models/smartplant_mobilenetv3.pt
      - uses: actions/upload-artifact@v4
        with:
          name: smartplant-onnx-assets
          path: |
            android-edge/app/src/main/assets/smartplant.onnx
            android-edge/app/src/main/assets/labels.json
            android-edge/app/src/main/assets/model_manifest.json
          if-no-files-found: error
          retention-days: 7

  android-compile:
    needs: [onnx-parity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: smartplant-onnx-assets
          path: android-edge/app/src/main/assets
      # Hosted Ubuntu includes Android SDK; avoid setup-android@v3's obsolete 'tools' request.
      - name: Prepare supported Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          echo "Using SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android debug APK
        working-directory: android-edge
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: smartplant-edge-iot-phase3-debug-UNTESTED
          path: android-edge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
