name: Android Edge Phase 1 Static Checks
on:
  push:
    branches: [feature/smartplant-android-edge-phase1]
  pull_request:
    paths:
      - 'android-edge/**'
      - 'scripts/export_smartplant_onnx.py'
      - 'tests/test_edge_export.py'
      - '.github/workflows/android-edge-phase1.yml'
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_edge_export.py
  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android debug app
        working-directory: android-edge
        run: gradle :app:assembleDebug --no-daemon
